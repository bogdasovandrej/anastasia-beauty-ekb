<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0faf5"/>
      <stop offset="100%" style="stop-color:#c8eedd"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5ec47c"/>
      <stop offset="100%" style="stop-color:#3aa060"/>
    </linearGradient>
  </defs>
  <rect width="560" height="420" fill="url(#bg)"/>
  <circle cx="280" cy="185" r="130" fill="white" opacity="0.35"/>
  <circle cx="280" cy="185" r="105" fill="url(#accent)" opacity="0.1"/>
  <!-- Маленькая голова ребёнка -->
  <ellipse cx="280" cy="172" rx="48" ry="55" fill="#edf8f0" opacity="0.95"/>
  <!-- Пушистые волосы ребёнка -->
  <path d="M232 148 Q228 115 252 98 Q266 88 280 90 Q294 88 308 98 Q332 115 328 148 Q315 128 280 126 Q245 128 232 148 Z" fill="#5ec47c" opacity="0.85"/>
  <!-- Хвостики -->
  <ellipse cx="232" cy="155" rx="14" ry="18" fill="#5ec47c" opacity="0.75"/>
  <ellipse cx="328" cy="155" rx="14" ry="18" fill="#5ec47c" opacity="0.75"/>
  <!-- Заколочки -->
  <ellipse cx="218" cy="148" rx="8" ry="5" fill="#e8737a" opacity="0.9" transform="rotate(-20 218 148)"/>
  <ellipse cx="342" cy="148" rx="8" ry="5" fill="#e8737a" opacity="0.9" transform="rotate(20 342 148)"/>
  <!-- Улыбка (ребёнок) -->
  <path d="M264 205 Q280 218 296 205" fill="none" stroke="#e8737a" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- Ножницы маленькие -->
  <g transform="translate(345,228) rotate(-20)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#3aa060" stroke-width="2.5" opacity="0.85"/>
    <circle cx="18" cy="0" r="8" fill="none" stroke="#3aa060" stroke-width="2.5" opacity="0.85"/>
    <line x1="6" y1="6" x2="46" y2="28" stroke="#3aa060" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <line x1="12" y1="-3" x2="46" y2="-22" stroke="#3aa060" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  </g>
  <!-- Звёздочки декор -->
  <text x="160" y="140" font-size="22" opacity="0.25" fill="#5ec47c">✦</text>
  <text x="390" y="270" font-size="18" opacity="0.22" fill="#3aa060">✦</text>
  <text x="400" y="130" font-size="14" opacity="0.2" fill="#e8737a">✦</text>
  <circle cx="150" cy="200" r="20" fill="#5ec47c" opacity="0.1"/>
  <circle cx="420" cy="230" r="26" fill="#3aa060" opacity="0.08"/>
  <!-- Нижняя полоса -->
  <rect x="0" y="360" width="560" height="60" fill="white" opacity="0.6"/>
  <rect x="0" y="358" width="560" height="3" fill="url(#accent)" opacity="0.55"/>
  <text x="280" y="398" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#3aa060" font-weight="bold" letter-spacing="1.5">Детская стрижка</text>
</svg>
