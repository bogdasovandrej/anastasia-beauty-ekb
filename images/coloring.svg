<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef6e4"/>
      <stop offset="100%" style="stop-color:#f0d9c8"/>
    </linearGradient>
    <linearGradient id="hair1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8a87c"/>
      <stop offset="50%" style="stop-color:#d4738a"/>
      <stop offset="100%" style="stop-color:#9b5de5"/>
    </linearGradient>
    <linearGradient id="hair2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7c59f"/>
      <stop offset="100%" style="stop-color:#ef8c74"/>
    </linearGradient>
    <linearGradient id="brush" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5ec4c0"/>
      <stop offset="100%" style="stop-color:#3a8fb5"/>
    </linearGradient>
  </defs>
  <!-- Фон -->
  <rect width="560" height="420" fill="url(#bg)"/>
  <!-- Декоративные круги -->
  <circle cx="490" cy="50" r="70" fill="#f5d0d0" opacity="0.4"/>
  <circle cx="80" cy="370" r="90" fill="#d4e8f0" opacity="0.35"/>
  <circle cx="520" cy="380" r="50" fill="#f7c59f" opacity="0.3"/>
  <!-- Силуэт головы -->
  <ellipse cx="280" cy="155" rx="72" ry="82" fill="#f5e0d3"/>
  <ellipse cx="280" cy="260" rx="95" ry="60" fill="#f5e0d3"/>
  <!-- Волосы с градиентом — основная масса -->
  <path d="M210 120 Q195 80 220 55 Q250 25 280 30 Q310 25 340 55 Q365 80 350 120 Q340 100 315 95 Q280 88 245 95 Z" fill="url(#hair1)"/>
  <!-- Длинные волосы -->
  <path d="M215 115 Q185 160 190 220 Q195 260 210 280 Q225 180 230 140 Z" fill="url(#hair1)" opacity="0.9"/>
  <path d="M345 115 Q375 160 370 220 Q365 260 350 280 Q335 180 330 140 Z" fill="url(#hair1)" opacity="0.9"/>
  <!-- Цветные пряди (эффект окрашивания) -->
  <path d="M220 118 Q205 170 212 230 Q218 200 225 160 Z" fill="#f7c59f" opacity="0.8"/>
  <path d="M340 118 Q355 170 348 230 Q342 200 335 160 Z" fill="#5ec4c0" opacity="0.7"/>
  <path d="M250 92 Q238 130 242 175 Q248 140 255 110 Z" fill="#d4738a" opacity="0.7"/>
  <path d="M310 92 Q322 130 318 175 Q312 140 305 110 Z" fill="#9b5de5" opacity="0.6"/>
  <!-- Кисть для окрашивания -->
  <rect x="370" y="170" width="14" height="80" rx="7" fill="url(#brush)" transform="rotate(-30 377 210)"/>
  <rect x="371" y="245" width="12" height="30" rx="3" fill="#c8e6e5" transform="rotate(-30 377 260)"/>
  <rect x="373" y="272" width="10" height="18" rx="2" fill="url(#hair1)" transform="rotate(-30 377 280)"/>
  <!-- Декоративные точки-капли краски -->
  <circle cx="155" cy="195" r="8" fill="#5ec4c0" opacity="0.7"/>
  <circle cx="145" cy="210" r="5" fill="#d4738a" opacity="0.6"/>
  <circle cx="165" cy="215" r="6" fill="#f7c59f" opacity="0.7"/>
  <circle cx="410" cy="300" r="7" fill="#9b5de5" opacity="0.5"/>
  <circle cx="425" cy="288" r="4" fill="#5ec4c0" opacity="0.6"/>
  <!-- Подпись услуги -->
  <rect x="120" y="345" width="320" height="52" rx="26" fill="white" opacity="0.85"/>
  <text x="280" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#888" letter-spacing="2">✦ ✦ ✦</text>
  <text x="280" y="386" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#c96a7a" font-weight="bold" letter-spacing="1">Окрашивание волос</text>
</svg>
