<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#faf7f4">
<title>Планер — Море красок</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="images/logo.jpg">
<style>
:root{--bg:#faf7f4;--card:#fff;--ink:#1c1917;--ink2:#57534e;--ink3:#a8a29e;--line:#ebe4dc;
--rose:#d4a5a5;--rose2:#b27d7d;--soft:#f7ebeb;--ok:#1d7a3f;--okbg:#e7f6ec;--off:#c07816;--offbg:#fdf3e3}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font:15px/1.5 -apple-system,system-ui,Roboto,sans-serif;background:var(--bg);color:var(--ink);
padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:rgba(250,247,244,.95);backdrop-filter:blur(12px);
border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.nav{display:flex;align-items:center;gap:8px}
.nav button{flex:none;width:46px;height:46px;border:1px solid var(--line);background:var(--card);
border-radius:14px;font-size:20px;color:var(--ink)}
.nav .t{flex:1;text-align:center}
.nav .t b{display:block;font-size:16px}
.nav .t span{font-size:12px;color:var(--ink3)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:none;min-width:52px;padding:8px 6px;border-radius:12px;border:1px solid var(--line);
background:var(--card);text-align:center;font-size:12px;color:var(--ink2)}
.day b{display:block;font-size:16px;color:var(--ink)}
.day.off{background:var(--offbg);border-color:transparent;color:var(--off)}
.day.off b{color:var(--off)}
.day.on{background:var(--rose2);border-color:transparent;color:#fff}
.day.on b{color:#fff}
.day .cnt{display:block;font-size:10px;margin-top:2px;opacity:.85}
.badge{display:block;text-align:center;margin-top:8px;font-size:12px;font-weight:700}
.badge.w{color:var(--ok)}.badge.o{color:var(--off)}
.offline{background:#fff4e5;color:#8a5a00;text-align:center;font-size:12.5px;padding:7px;display:none}
.offline.on{display:block}
.wrap{padding:12px}
.row{display:flex;gap:8px;margin-bottom:6px}
.hh{flex:none;width:44px;font-size:12px;color:var(--ink3);font-weight:700;padding-top:11px}
.cell{flex:1;min-height:38px;border:1px dashed var(--line);border-radius:12px;background:var(--card);
display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:12.5px}
.cell:active{background:var(--soft)}
.bk{flex:1;border-radius:14px;padding:11px 14px;background:linear-gradient(135deg,#d4a5a5,#b27d7d);color:#fff}
.bk b{display:block;font-size:15px}
.bk .s{font-size:13px;opacity:.93}
.bk .p{font-size:13px;opacity:.93;margin-top:2px}
.bk .n{font-size:12.5px;opacity:.93;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.3)}
.empty{text-align:center;color:var(--ink2);padding:26px 10px}
dialog{border:none;border-radius:20px;padding:0;width:min(420px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(28,25,23,.45)}
.dlg{padding:20px}
.dlg h3{font-size:17px;margin-bottom:6px}
.dlg label{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
color:var(--ink3);margin:12px 0 5px}
.dlg input,.dlg select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;
font:15px inherit;background:var(--bg);color:var(--ink)}
.btns{display:flex;gap:8px;margin-top:18px}
.btns button{flex:1;padding:14px;border:none;border-radius:14px;font:700 15px inherit;color:#fff;
background:linear-gradient(135deg,#d4a5a5,#b27d7d)}
.btns button.gray{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.btns button.red{background:#c0392b}
.msg{padding:10px 14px;border-radius:12px;font-size:13.5px;margin-top:12px;display:none}
.msg.err{display:block;background:#fdeceb;color:#c0392b}
.gate{padding:40px 24px;text-align:center}
.gate input{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;margin:14px 0;font:15px inherit}
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <h2>Планер</h2>
  <p style="color:#57534e;margin-top:8px">Вставьте ссылку с ключом, которую прислал бот.</p>
  <input id="gateKey" placeholder="ключ или ссылка целиком">
  <div class="btns"><button id="gateOk">Открыть</button></div>
</div>

<div id="app" hidden>
  <div class="top">
    <div class="nav">
      <button id="prev" aria-label="Назад">←</button>
      <div class="t"><b id="dt">—</b><span id="cnt"></span></div>
      <button id="next" aria-label="Вперёд">→</button>
    </div>
    <div class="strip" id="strip"></div>
    <span class="badge" id="wd"></span>
  </div>
  <div class="offline" id="off">Нет сети — показываю последние загруженные данные</div>
  <div class="wrap" id="grid"></div>
</div>

<dialog id="add"><form class="dlg" method="dialog">
  <h3 id="addTitle">Новая запись</h3>
  <label>Услуга</label><select id="svc"></select>
  <label>Имя и фамилия</label><input id="nm" placeholder="Иванова Мария" maxlength="80">
  <label>Телефон</label><input id="ph" type="tel" placeholder="8 900 123-45-67" maxlength="30">
  <div class="msg" id="addMsg"></div>
  <div class="btns"><button type="button" class="gray" id="addCancel">Отмена</button>
  <button type="button" id="addOk">Записать</button></div>
</form></dialog>

<dialog id="info"><div class="dlg">
  <h3 id="infoTitle">Запись</h3>
  <div id="infoBody"></div>
  <div class="btns"><button type="button" class="gray" id="infoClose">Закрыть</button>
  <button type="button" class="red" id="infoDel">Отменить запись</button></div>
</div></dialog>

<script>
/* Планер мастера.
   Живёт на сайте, а не на сервере бота: адрес сайта в России открывается
   быстро, а адрес воркера заблокирован. Данные берём через российский шлюз.

   Главное отличие от обычной страницы — работает без сети. При каждой загрузке
   данные складываются в память телефона, и при следующем открытии сначала
   рисуется сохранённое, а уже потом подтягивается свежее. Поэтому планер
   открывается мгновенно и отвечает на вопрос «когда свободно» даже там,
   где интернета нет. */

var API='https://d5dlpkp30bicbqp0edul.7qsg961h.apigw.yandexcloud.net';
var FROM=480,TO=1140,STEP=30,DAYS_AHEAD=21;
var KEY=null,day=null,data=null,pickStart=null,pickId=null;

function hhmm(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function today(){return new Date(Date.now()+5*3600000).toISOString().slice(0,10)}
function esc(s){return String(s==null?'':s).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]})}
function shiftDay(d,n){var p=d.split('-');var x=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}

// ---- память телефона ----
function save(k,v){try{localStorage.setItem('mk_'+k,JSON.stringify(v))}catch(e){}}
function load(k){try{var v=localStorage.getItem('mk_'+k);return v?JSON.parse(v):null}catch(e){return null}}

// ---- ключ доступа ----
(function(){
  var q=new URLSearchParams(location.search).get('key');
  if(q){KEY=q;save('key',q);history.replaceState(null,'','planer.html');}
  else KEY=load('key');
  if(!KEY){document.getElementById('gate').hidden=false;return}
  document.getElementById('app').hidden=false;
  day=today();render();refresh();prefetch();
})();

document.getElementById('gateOk').onclick=function(){
  var v=document.getElementById('gateKey').value.trim();
  var m=v.match(/key=([a-f0-9]{16,})/i);
  KEY=m?m[1]:v;
  if(!KEY)return;
  save('key',KEY);location.reload();
};

// ---- сеть ----
function api(path,opts){
  return fetch(API+path+(path.indexOf('?')<0?'?':'&')+'key='+encodeURIComponent(KEY),opts)
    .then(function(r){return r.json()});
}
function setOffline(on){document.getElementById('off').classList.toggle('on',on)}

function refresh(){
  return api('/planer/data&day='+day).then(function(d){
    if(!d||d.error)return;
    data=d;save('day_'+day,d);setOffline(false);render();
  }).catch(function(){setOffline(true)});
}

/* Заранее забираем три недели вперёд. Ради этого всё и делалось: когда
   клиентка звонит и спрашивает «когда есть окно», мастер открывает планер
   и листает дни, даже если сети нет. */
function prefetch(){
  var d=day,chain=Promise.resolve();
  for(var i=1;i<=DAYS_AHEAD;i++){
    (function(dd){chain=chain.then(function(){
      return api('/planer/data&day='+dd).then(function(x){if(x&&!x.error)save('day_'+dd,x)}).catch(function(){});
    })})(d=shiftDay(d,1));
  }
  chain.then(drawStrip);
}

// ---- отрисовка ----
function drawStrip(){
  var s=document.getElementById('strip'),html='',d=today();
  for(var i=0;i<14;i++){
    var c=load('day_'+d),n=c&&c.записи?c.записи.length:0;
    var cls=d===day?'on':(c&&c.рабочий===false?'off':'');
    var p=d.split('-');
    html+='<button class="day '+cls+'" data-d="'+d+'"><b>'+(+p[2])+'</b>'+
      ['вс','пн','вт','ср','чт','пт','сб'][new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay()]+
      '<span class="cnt">'+(c?(c.рабочий===false?'вых':(n?n+' зап':'—')):'·')+'</span></button>';
    d=shiftDay(d,1);
  }
  s.innerHTML=html;
  var on=s.querySelector('.day.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
}

function render(){
  var cached=data&&data.day===day?data:load('day_'+day);
  if(cached)data=cached;
  var p=day.split('-');
  document.getElementById('dt').textContent=cached?cached.подпись:(+p[2])+'.'+p[1];
  document.getElementById('cnt').textContent=cached?(cached.записи.length?cached.записи.length+' записи':'записей нет'):'загружаю…';
  var wd=document.getElementById('wd');
  if(cached){wd.textContent=cached.рабочий?'рабочий день':'выходной';wd.className='badge '+(cached.рабочий?'w':'o')}
  else wd.textContent='';
  if(cached){
    var sel=document.getElementById('svc');
    sel.innerHTML=cached.услуги.map(function(x){return '<option value="'+x.имя+'">'+x.имя+' · '+x.мин+' мин</option>'}).join('');
  }
  drawStrip();
  var g=document.getElementById('grid');
  if(!cached){g.innerHTML='<p class="empty">Загружаю…</p>';return}
  if(!cached.рабочий&&!cached.записи.length){g.innerHTML='<p class="empty">В этот день вы не работаете.</p>';return}
  var html='',m=FROM;
  while(m<TO){
    var bk=cached.записи.find(function(b){return b.начало===m});
    var busy=cached.записи.find(function(b){return m>=b.начало&&m<b.конец});
    if(bk){
      html+='<div class="row"><div class="hh">'+hhmm(m)+'</div><div class="bk" data-id="'+bk.id+'">'+
        '<b>'+esc(bk.имя)+'</b><span class="s">'+esc(bk.услуга)+' · '+bk.время+'</span>'+
        '<div class="p">'+esc(bk.телефон)+'</div>'+
        (bk.пометка?'<div class="n">'+esc(bk.пометка)+'</div>':'')+'</div></div>';
      m=bk.конец;
    }else if(busy){m+=STEP}
    else{
      html+='<div class="row"><div class="hh">'+hhmm(m)+'</div>'+
        '<div class="cell" data-min="'+m+'">свободно</div></div>';
      m+=STEP;
    }
  }
  g.innerHTML=html;
}

// ---- управление ----
document.getElementById('prev').onclick=function(){day=shiftDay(day,-1);render();refresh()};
document.getElementById('next').onclick=function(){day=shiftDay(day,1);render();refresh()};
document.getElementById('strip').addEventListener('click',function(e){
  var b=e.target.closest('[data-d]');if(!b)return;day=b.dataset.d;render();refresh();
});
document.getElementById('grid').addEventListener('click',function(e){
  var free=e.target.closest('.cell');
  if(free){pickStart=+free.dataset.min;
    document.getElementById('addTitle').textContent='Запись на '+hhmm(pickStart);
    document.getElementById('addMsg').className='msg';
    document.getElementById('add').showModal();return}
  var bk=e.target.closest('.bk');
  if(bk&&data){var b=data.записи.find(function(x){return x.id==bk.dataset.id});if(!b)return;
    pickId=b.id;
    document.getElementById('infoTitle').textContent=b.имя;
    document.getElementById('infoBody').innerHTML='<p>'+esc(b.услуга)+'<br>'+b.время+'</p>'+
      '<p style="margin-top:8px"><a href="tel:'+esc(b.телефон)+'">'+esc(b.телефон)+'</a></p>'+
      (b.пометка?'<p style="margin-top:8px;color:#57534e">'+esc(b.пометка)+'</p>':'');
    document.getElementById('info').showModal()}
});
document.getElementById('addCancel').onclick=function(){document.getElementById('add').close()};
document.getElementById('infoClose').onclick=function(){document.getElementById('info').close()};

document.getElementById('addOk').onclick=function(){
  var body={start:pickStart,service:document.getElementById('svc').value,
    name:document.getElementById('nm').value.trim(),phone:document.getElementById('ph').value.trim()};
  api('/planer/add&day='+day,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){
      if(r&&r.ok){document.getElementById('add').close();
        document.getElementById('nm').value='';document.getElementById('ph').value='';refresh()}
      else{var m=document.getElementById('addMsg');m.className='msg err';
        m.textContent=(r&&r.error)||'Не получилось'}
    })
    .catch(function(){var m=document.getElementById('addMsg');m.className='msg err';
      m.textContent='Нет сети. Записать можно только с интернетом'});
};
document.getElementById('infoDel').onclick=function(){
  api('/planer/cancel&day='+day,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:pickId})})
    .then(function(){document.getElementById('info').close();refresh()})
    .catch(function(){document.getElementById('info').close()});
};

window.addEventListener('online',function(){setOffline(false);refresh()});
window.addEventListener('offline',function(){setOffline(true)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
