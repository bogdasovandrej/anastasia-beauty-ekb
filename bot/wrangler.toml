name = "mk-bot"
main = "worker.js"
compatibility_date = "2026-09-01"

# График студии. База D1: чтение сразу видит запись, поэтому быстрые
# нажатия в боте не затирают друг друга. KV для этого не годился.
[[d1_databases]]
binding = "DB"
database_name = "more-krasok"
database_id = "22a8c27d-d31a-4b24-a7f4-f533c3905623"

# Секреты здесь НЕ хранятся — они задаются отдельно, командой
# npx wrangler secret put ИМЯ
# и лежат в Cloudflare, а не в репозитории:
#   TG_TOKEN      токен телеграм-бота
#   TG_ADMIN_ID   1954130697
#   TG_CLIENT_TOKEN токен второго бота — для клиентов
#   MAX_TOKEN     токен бота в МАКСе
#   MAX_ADMIN_ID  необязательно
#   ADMIN_KEY     длинная случайная строка, нужна для /setup

# Каждые полчаса: напоминания клиентам примерно за три часа до визита.
# В утренний запуск (8:00 по Екатеринбургу) дополнительно — сводка мастеру
# и уборка старых записей и заметок.
[triggers]
crons = ["*/30 * * * *"]   # 8:00 по Екатеринбургу: чистка, напоминания клиентам, расписание мастеру
